# Proves the data pipeline still builds, on pull requests that touch it.
# Publishing happens in release.yml, which puts the packs and the APK in one
# release after the PR is merged.
name: Map data

on:
  pull_request:
    paths:
      - 'pipeline/tiles/**'
      - 'pipeline/routing/**'
      - 'pipeline/search/**'
      - 'pipeline/transit/**'
      - 'pipeline/lib/**'
      - 'pipeline/Makefile'
      - '.github/workflows/data.yml'

permissions:
  contents: read

concurrency:
  group: map-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nyc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build basemap-nyc.pmtiles
        env:
          PLANETILER_HEAP: 8g
        run: make -C pipeline tiles-nyc

      - name: Build routing-nyc.tar
        run: make -C pipeline routing-nyc

      - name: Build search-nyc.sqlite
        run: make -C pipeline search-nyc

      - name: Build transit-nyc.sqlite
        run: make -C pipeline transit-nyc

      - name: Checksum
        run: |
          cd pipeline/data/out
          for pack in basemap-nyc.pmtiles routing-nyc.tar search-nyc.sqlite transit-nyc.sqlite; do
            sha256sum "$pack" | tee "$pack.sha256"
          done
          ls -lh
