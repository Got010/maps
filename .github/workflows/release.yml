# One release with everything: the signed APK and the data packs.
#
# Runs on its own after every merge to main, and on the 2nd of each month to
# pick up fresh OpenStreetMap and MTA data. Each run publishes the next
# version (v0.2.0 -> v0.2.1 ...), so a phone or Obtainium only ever has to
# look at the latest release.
#
# Packs are rebuilt only when needed (pipeline changed, the monthly run, or
# Run workflow with "Rebuild data"); otherwise the new release carries the
# packs from the previous one, so the app and its data always ship together.
#
# The release is created as a draft first and every job uploads its files to
# it directly: the statewide packs run to a couple of gigabytes, more than a
# private repository's Actions artifact storage holds. Each pack builds in
# its own job, so a 2-core runner's disk and memory see one pack at a time.
# The publish job then writes the manifest and turns the draft into the
# release. A failed run deletes its draft.
#
# Pushing a tag like v1.0.0 by hand still works and sets the version.
#
# Only a commit on main is built signed and published: a push to main, the monthly schedule and a manual
# run on main all run main's own code, and a tag is compared with main first. A manual run from any other
# branch, or a tag on a commit that is not on main, builds and tests the app unsigned and publishes
# nothing (the plan job's `publish` output). The signing secrets are decoded only when it is true.
#
# The release gate (gate/gate.py) compares the release APK with gate/baseline.json in the app job. The
# release-check job then checks the APK's signing certificate against the one pinned there, before
# anything is published. The app job and release-check run the repository's build code and scripts, so
# they hold a read-only token and the APK reaches the publish job as an artifact. The data jobs keep a
# write token because the packs are too large for artifact storage, and the publish job runs
# scripts/release-manifest.py next to its token because a draft release's files are only reachable with
# one; both run only on a commit that is on main.
#
# Only GitHub's own actions are used, pinned to commit SHAs.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '17 6 2 * *'   # 06:17 UTC on the 2nd of each month
  workflow_dispatch:
    inputs:
      rebuild_data:
        description: Rebuild the map data packs
        type: boolean
        default: false

permissions: {}

# One release at a time, in order; never cancel one halfway through.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # What a release ships; `make -C pipeline state` builds the same list.
  PACKS: basemap-nyc.pmtiles basemap-li.pmtiles basemap-hudson.pmtiles basemap-capital.pmtiles basemap-western.pmtiles basemap-njn.pmtiles routing-nys.tar search-nys.sqlite transit-nyc.sqlite voice-norman.zip

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # creates the draft release; this job runs no repository code
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
      data: ${{ steps.plan.outputs.data }}
      packs: ${{ steps.plan.outputs.packs }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A run from main (push, schedule, manual) runs main's own code. A tag can name any commit, so it
      # is compared with main (identical or behind) first; the branch is resolved to its SHA, so a tag
      # called "main" can't stand in for it. Anything else builds unsigned and publishes nothing.
      - name: Decide whether this run may sign and publish
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish=false
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            publish=true
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$main...$GITHUB_SHA" --jq .status)"
            if [[ "$status" == identical || "$status" == behind ]]; then
              publish=true
            else
              echo "::warning::Tag $GITHUB_REF_NAME is not on main ($status): building unsigned, nothing is published."
            fi
          else
            echo "::warning::$GITHUB_REF_NAME is not main: building unsigned, nothing is published."
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Pick the version and whether to rebuild data
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ inputs.rebuild_data }}
        run: |
          previous="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag must look like v1.2.3, got $tag"
              exit 1
            fi
            # The previous release is the newest tag other than this one.
            previous="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vx "$tag" | head -1)"
          else
            # Next patch version; versionCode allows 0-99 per part.
            IFS=. read -r major minor patch <<< "${previous#v}"
            major=${major:-0}; minor=${minor:-1}; patch=${patch:--1}
            patch=$((patch + 1))
            if (( patch > 99 )); then patch=0; minor=$((minor + 1)); fi
            if (( minor > 99 )); then minor=0; major=$((major + 1)); fi
            tag="v$major.$minor.$patch"
          fi

          data=false
          reason="reusing packs from $previous"
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$REBUILD" == true ]]; then
            data=true; reason="monthly refresh or requested"
          elif [[ -z "$previous" ]]; then
            data=true; reason="no earlier release"
          elif ! gh release view "$previous" --json assets --jq '.assets[].name' > assets.txt 2>/dev/null; then
            data=true; reason="$previous has no release"
          else
            for pack in $PACKS; do
              grep -qx "$pack" assets.txt || { data=true; reason="$previous lacks $pack"; }
            done
            if git diff --quiet "$previous" HEAD -- pipeline ':(exclude)pipeline/styles'; then :; else
              data=true; reason="pipeline changed since $previous"
            fi
          fi

          # The matrix for the data jobs: one entry per pack.
          packs="$(printf '%s\n' $PACKS | jq -R . | jq -sc .)"

          echo "Release $tag; data: $data ($reason)"
          {
            echo "version=${tag#v}"
            echo "tag=$tag"
            echo "previous=$previous"
            echo "data=$data"
            echo "packs=$packs"
          } >> "$GITHUB_OUTPUT"

      # Everything uploads here; publish turns it into the release at the end.
      # A tag released from the website already has one: upload to that.
      - name: Create the draft release
        if: steps.mode.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG exists; its files will be replaced."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Southbound ${TAG#v}" --notes "Building…"
          fi

  # Builds, tests and gates the release APK; signs it only when the plan says this run may publish. This job
  # runs Gradle, plugins and the repository's scripts, so its token is read-only: the signed APK goes to the
  # release-check and publish jobs as an artifact.
  app:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      # No Gradle or build cache here: this job builds what gets signed and published, so it starts from
      # what Gradle's dependency verification and the pinned downloads allow, never from a saved cache.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true

      - name: Check the Gradle wrapper against Gradle's published checksums
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          version=$(sed -n 's#^distributionUrl=.*/gradle-\(.*\)-bin\.zip$#\1#p' "$props")
          published=$(curl -fsSL "https://services.gradle.org/distributions/gradle-$version-bin.zip.sha256")
          pinned=$(sed -n 's/^distributionSha256Sum=//p' "$props")
          if [ "$published" != "$pinned" ]; then
            echo "::error::distributionSha256Sum ($pinned) is not Gradle's published checksum ($published)"
            exit 1
          fi
          published=$(curl -fsSL "https://services.gradle.org/distributions/gradle-$version-wrapper.jar.sha256")
          actual=$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
          if [ "$published" != "$actual" ]; then
            echo "::error::gradle-wrapper.jar ($actual) is not Gradle's published $version wrapper ($published)"
            exit 1
          fi
          echo "Gradle $version wrapper and distribution checksums match gradle.org"

      # Both downloads are checked against pinned SHA-256 values.
      - name: Fetch the offline voice (sherpa-onnx and Piper)
        run: scripts/fetch-voice.sh

      # zizmor's auditor persona asks for these secrets to live in a deployment environment; private
      # repositories on GitHub Free can't have environment secrets, so the guard is this if: (main, or a
      # tag on main, as decided in the plan job, which runs no repository code).
      - name: Decode signing key
        if: env.PUBLISH == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SOUTHBOUND_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::The SOUTHBOUND_KEYSTORE_BASE64 secret is not set. See README."
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SOUTHBOUND_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Without the signing key (a run that may not publish) the release APK is unsigned.
      - name: Test and build the release APK
        id: gradle
        env:
          SOUTHBOUND_KEYSTORE_PASSWORD: ${{ needs.plan.outputs.publish == 'true' && secrets.SOUTHBOUND_KEYSTORE_PASSWORD || '' }}
          SOUTHBOUND_KEY_ALIAS: ${{ needs.plan.outputs.publish == 'true' && secrets.SOUTHBOUND_KEY_ALIAS || '' }}
          SOUTHBOUND_KEY_PASSWORD: ${{ needs.plan.outputs.publish == 'true' && secrets.SOUTHBOUND_KEY_PASSWORD || '' }}
        run: |
          set -o pipefail
          # Dependency verification is forced on the command line, so a gradle.properties change can't
          # relax it. gradle/verification-metadata.xml is written by ci.yml (gate/README.md).
          if [ ! -f gradle/verification-metadata.xml ]; then
            echo "::error::gradle/verification-metadata.xml is missing: run CI on a pull request that deletes it to regenerate it (gate/README.md)."
            exit 1
          fi
          ./gradlew --dependency-verification=strict \
            --init-script gate/file-dependencies.init.gradle -Pgate.configuration=releaseRuntimeClasspath \
            testReleaseUnitTest :app:assembleRelease -Psouthbound.version="$VERSION" \
            :app:dependencies --configuration releaseRuntimeClasspath gateFileDependencies | tee "$RUNNER_TEMP/gradle.log"

      - name: Release gate (compare the release APK with gate/baseline.json)
        id: gate
        run: |
          apk=$(find app/build/outputs/apk/release -name 'app-release*.apk' | head -n 1)
          python3 gate/gate.py check --require-tools --require-pin --apk "$apk" --deps "$RUNNER_TEMP/gradle.log" \
            --generated build/gate/baseline.generated.json
          python3 -m unittest discover -s gate

      # So a session that can't download artifacts can copy the baseline this APK would need.
      - name: Print the baseline this APK would need
        if: failure() && steps.gate.outcome == 'failure' && hashFiles('build/gate/baseline.generated.json') != ''
        run: |
          echo "::group::build/gate/baseline.generated.json"
          cat build/gate/baseline.generated.json
          echo "::endgroup::"
          gate/annotate-file.sh build/gate/baseline.generated.json baseline-generated 0

      - name: Verify signature and checksum
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p out
          APK="out/southbound-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          (cd out && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # Handed to release-check and publish. One day is enough: they run right after this job.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.PUBLISH == 'true'
        with:
          name: release-apk
          path: out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: reports
          path: |
            **/build/reports/
            build/gate/
          if-no-files-found: ignore
          retention-days: 14

  # Read-only checks before anything is published: the commit is on main, and the APK is signed by the
  # certificate pinned in gate/baseline.json. They run the repository's gate/ script, so they live in a job
  # without a writing token; the publish job runs no gate code.
  release-check:
    if: needs.plan.outputs.publish == 'true'
    needs: [plan, app]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      apk_sha256: ${{ steps.cert.outputs.apk_sha256 }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # Only the gate files: the baseline of the commit the APK was built from, and the script.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: gate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-apk
          path: apks

      # The branch is resolved to its SHA first, so a tag called "main" can't stand in for it.
      - name: Check the commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$main...$GITHUB_SHA" --jq .status)
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "::error::$GITHUB_SHA is not on main (compare status: $status), so it is not published."
            exit 1
          fi

      # Fails on an unsigned APK or a certificate other than the one pinned in gate/baseline.json, so a
      # build signed with a different key is never offered as an update.
      - name: Check the signing certificate against gate/baseline.json
        id: cert
        run: |
          apk="apks/southbound-$VERSION.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::No signed release APK ($apk)."
            exit 1
          fi
          python3 gate/gate.py cert --require-pin --apk "$apk"
          echo "apk_sha256=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  # Starts only once the APK has passed the gate and the certificate check, so a release that would be
  # refused doesn't spend hours rebuilding packs. Only a commit on main gets here (publish is true).
  # This job runs the pipeline's scripts and third-party tools with a write token, because each pack goes
  # straight to the draft release (they are too large for artifact storage); nothing else can run here.
  data:
    needs: [plan, release-check]
    if: needs.plan.outputs.data == 'true' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write # uploads each pack to the draft release
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJSON(needs.plan.outputs.packs) }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      PACK: ${{ matrix.pack }}
      # routing-nys and search-nys merge two extracts; drop the inputs afterwards to spare the runner's disk.
      FREE_SOURCES: 1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Build ${{ matrix.pack }}
        env:
          # Optional repository variables (Settings > Secrets and variables >
          # Actions > Variables). ADDRESS_POINTS_URL adds the NYS Address Points
          # to the search pack; unset, search has OSM's addresses only.
          ADDRESS_POINTS_URL: ${{ vars.ADDRESS_POINTS_URL }}
          ADDRESS_POINTS_LAYER: ${{ vars.ADDRESS_POINTS_LAYER }}
          # Overture Places in the search pack, in their own tables (see
          # pipeline/search/overture.py). Set the variable OVERTURE to 0 to
          # leave them out, OVERTURE_RELEASE to pin a release or "latest",
          # OVERTURE_MIN_CONFIDENCE (default 0.5) higher for a smaller pack.
          OVERTURE: ${{ vars.OVERTURE || '1' }}
          OVERTURE_RELEASE: ${{ vars.OVERTURE_RELEASE }}
          OVERTURE_MIN_CONFIDENCE: ${{ vars.OVERTURE_MIN_CONFIDENCE }}
        run: |
          # basemap-western.pmtiles -> tiles-western; routing-nys.tar -> routing-nys;
          # voice-norman.zip -> voice-norman
          name="${PACK%%.*}"
          kind="${name%%-*}"; region="${name#*-}"
          [[ "$kind" == basemap ]] && kind=tiles
          make -C pipeline "$kind-$region"

      - name: Checksum and upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd pipeline/data/out
          sha256sum "$PACK" | tee "$PACK.sha256"
          ls -lh "$PACK"
          gh release upload "$TAG" "$PACK" "$PACK.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [plan, app, release-check, data]
    # Runs when the data jobs ran and passed, or were skipped because the
    # previous release's packs are reused.
    if: always() && needs.release-check.result == 'success' && (needs.data.result == 'success' || needs.data.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write # uploads to the draft release and publishes it
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      DATA: ${{ needs.plan.outputs.data }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: src
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-apk
          path: apk

      # Publishes exactly the APK release-check checked.
      - name: Upload the APK that release-check checked
        env:
          CHECKED: ${{ needs.release-check.outputs.apk_sha256 }}
        run: |
          apk="apk/southbound-$VERSION.apk"
          actual=$(sha256sum "$apk" | cut -d' ' -f1)
          if [ -z "$CHECKED" ] || [ "$actual" != "$CHECKED" ]; then
            echo "::error::$apk ($actual) is not the APK release-check checked ($CHECKED)"
            exit 1
          fi
          (cd apk && sha256sum -c "southbound-$VERSION.apk.sha256")
          gh release upload "$TAG" "$apk" "$apk.sha256" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Carry packs over from the previous release
        if: env.DATA != 'true'
        run: |
          mkdir -p out
          for pack in $PACKS; do
            gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir out \
              --pattern "$pack" --pattern "$pack.sha256"
          done
          (cd out && sha256sum -c ./*.sha256)
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          rm -rf out

      # The manifest needs every file's size and SHA-256, so fetch what the
      # jobs uploaded (a draft's files are only reachable with the token).
      - name: Write the release manifest
        run: |
          mkdir -p out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir out
          (cd out && sha256sum -c ./*.sha256)
          for pack in $PACKS; do
            [[ -f "out/$pack" ]] || { echo "::error::The release is missing $pack"; exit 1; }
          done
          python3 src/scripts/release-manifest.py out "$VERSION" > out/southbound.json
          cat out/southbound.json
          gh release upload "$TAG" out/southbound.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish release
        run: |
          if [[ "$DATA" == true ]]; then
            data_note="Map data rebuilt for this release."
          else
            data_note="Map data unchanged since $PREVIOUS."
          fi
          notes="Install southbound-$VERSION.apk once; Southbound then downloads the map data for the regions you pick and later updates by itself (Settings > Updates). The packs are also here to share to the app by hand: basemap-<region>.pmtiles (the map, one per region: nyc, li, hudson, capital, western, njn for northern New Jersey), search-nys.sqlite (search, New York and northern New Jersey), routing-nys.tar (directions, New York and northern New Jersey), transit-nyc.sqlite (NYC transit schedules) and voice-norman.zip (an extra built-in voice, downloaded only if picked in Settings > Voice). $data_note

          Map data © OpenMapTiles © OpenStreetMap contributors, ODbL. Schedules: MTA."
          # Tags made with this token don't start another run, so no loop.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
            --title "Southbound $VERSION" --notes "$notes"

  # A run that failed leaves no half-built draft behind. A release that was
  # already published (a tag made on the website) is left as it is.
  cleanup:
    needs: [plan, app, release-check, data, publish]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' && needs.publish.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # deletes the draft; this job runs no repository code
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Delete the draft
        run: |
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" == true ]]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            echo "Deleted the draft $TAG"
          fi
