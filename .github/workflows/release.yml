# One release with everything: the signed APK and the data packs.
#
# Runs on its own after every merge to main, and on the 2nd of each month to
# pick up fresh OpenStreetMap and MTA data. Each run publishes the next
# version (v0.2.0 -> v0.2.1 ...), so a phone or Obtainium only ever has to
# look at the latest release.
#
# Packs are rebuilt only when needed (pipeline or its pip lock changed, the monthly run, or
# Run workflow with "Rebuild data"); otherwise the new release carries the
# packs from the previous one, so the app and its data always ship together.
# pipeline/styles and pipeline/weather don't count: the styles ship inside the
# APK, and the forecast pack has its own workflow (weather.yml).
#
# The release is created as a draft first and every job uploads its files to
# it directly: the statewide packs run to a couple of gigabytes, more than a
# private repository's Actions artifact storage holds. Each pack builds in
# its own job, so a 2-core runner's disk and memory see one pack at a time.
# The publish job then writes the manifest and turns the draft into the
# release. A failed run deletes its draft.
#
# Pushing a tag like v1.0.0 by hand still works and sets the version.
#
# Only a commit on main is signed and published: a push to main, the monthly schedule and a manual run on
# main all run main's own code, and a tag push is compared with main first. A manual run from any other
# branch, a manual run on a tag, or a tag on a commit that is not on main builds and tests the app unsigned
# and publishes nothing (the plan job's `publish` output).
#
# Signing is a separate job. The app job builds the release APK unsigned (Gradle is never given a key) and
# runs the tests and the release gate (gate/gate.py) on it; it references no secret. The sign job is the only
# place the four SOUTHBOUND_* signing secrets appear: it checks out nothing and runs no repository code
# (GitHub's own actions, gh and the Android SDK's zipalign and apksigner only), so a job that runs
# repository code never holds the key. GitHub sends a job every secret it references, whether or not a step
# is skipped, so an `if:` on a step would not be a guard. release-check then checks the signed APK's
# certificate against the one pinned in gate/baseline.json, before anything is published.
#
# The data jobs keep a write token because the packs are too large for artifact storage, and the publish
# job runs scripts/release-manifest.py next to its token because a draft release's files are only
# reachable with one; both run only on a commit that is on main. Nothing else with a write token runs
# repository code.
#
# Recovering from a failed run: when a run fails after the draft exists (the data jobs, publish), the cleanup
# job deletes the draft and the run's two APK artifacts, so only "Re-run all jobs" recovers; "Re-run failed
# jobs" would find neither. The release queue holds one waiting run, and a newer one replaces it: a scheduled
# run (the monthly data refresh) that is still waiting can be replaced by a push, and that month's refresh is
# then skipped. Start it again with Run workflow on main and "Rebuild data" ticked.
#
# The release is created, uploaded to and published with the gh CLI only: no third-party release action
# runs next to the write token. Only GitHub's own actions and gradle/actions/setup-gradle are used, pinned to
# commit SHAs; setup-gradle runs only in the jobs that have no secret and a read-only token.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '17 6 2 * *'   # 06:17 UTC on the 2nd of each month
  workflow_dispatch:
    inputs:
      rebuild_data:
        description: Rebuild the map data packs
        type: boolean
        default: false

permissions: {}

# One release at a time, in order, and never cancel one halfway through. Runs that can publish (main, and
# pushes of v* tags) share one queue; every other run (a manual run on a branch or a tag) has its own, so it
# can't take the place of a release that is waiting for main's turn. A queue holds one waiting run: a newer
# one replaces it.
concurrency:
  group: ${{ (github.ref == 'refs/heads/main' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && 'release' || format('release-{0}', github.ref) }}
  cancel-in-progress: false

env:
  # What a release ships; `make -C pipeline state` builds the same lists. PACKS are the packs every app knows,
  # and the only ones southbound.json lists: an app from before STATE_PACKS takes every routing and search pack
  # its manifest names. STATE_PACKS are for apps that read southbound-v2.json: the other states' regions' basemaps and
  # OSM-only search packs, and routing-packs.json, which stands for the split routing build
  # (pipeline/routing/split.sh): routing-main.tar, routing-main-midwest.tar, the seam pack and the region packs it
  # lists, whose names come from the graph. The Midwest's fifteen regions (planned in regions.json: built and
  # shipped here, offered by the app from its next version) come after the first four states'.
  PACKS: basemap-nyc.pmtiles basemap-li.pmtiles basemap-hudson.pmtiles basemap-capital.pmtiles basemap-western.pmtiles basemap-njn.pmtiles routing-nys.tar search-nys.sqlite transit-nyc.sqlite voice-norman.zip
  STATE_PACKS: basemap-njs.pmtiles basemap-ct.pmtiles basemap-pae.pmtiles basemap-paw.pmtiles basemap-md.pmtiles search-njs.sqlite search-ct.sqlite search-pae.sqlite search-paw.sqlite search-md.sqlite routing-packs.json basemap-ohn.pmtiles basemap-ohs.pmtiles basemap-in.pmtiles basemap-iln.pmtiles basemap-ils.pmtiles basemap-mis.pmtiles basemap-miu.pmtiles basemap-wi.pmtiles basemap-mn.pmtiles basemap-ia.pmtiles basemap-mo.pmtiles basemap-nd.pmtiles basemap-sd.pmtiles basemap-ne.pmtiles basemap-ks.pmtiles search-ohn.sqlite search-ohs.sqlite search-in.sqlite search-iln.sqlite search-ils.sqlite search-mis.sqlite search-miu.sqlite search-wi.sqlite search-mn.sqlite search-ia.sqlite search-mo.sqlite search-nd.sqlite search-sd.sqlite search-ne.sqlite search-ks.sqlite
  # Also for southbound-v2.json, and not jobs of their own: the search packs of New York's regions and northern New
  # Jersey, which the search-nys.sqlite job cuts from it (pipeline/search/split_search.py: one per region whose
  # "search_from" in regions.json is nys).
  NYS_SEARCH_PACKS: search-nyc.sqlite search-li.sqlite search-hudson.sqlite search-capital.sqlite search-western.sqlite search-njn.sqlite
  # The Android SDK build-tools that align, sign and verify the release APK, by version, so the signing tools
  # only change in a pull request. The app job's signing rehearsal fails if the runner lacks them.
  BUILD_TOOLS_VERSION: "36.0.0"
  # The signature schemes of the releases so far: v2 only (southbound-0.1.12.apk's signing block holds v2 and
  # nothing else: no JAR signature, no v3, no v4). The checks after signing read these flags, so the flags and
  # the checks cannot disagree.
  SIGNING_SCHEMES: "--v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # this job only reads: the draft release is created later, by the draft job
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
      data: ${{ steps.plan.outputs.data }}
      packs: ${{ steps.plan.outputs.packs }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A run from main (push, schedule, manual) runs main's own code. A tag push can name any commit, so it
      # is compared with main (identical or behind) first; the branch is resolved to its SHA, so a tag
      # called "main" can't stand in for it. A manual run on a tag is not a tag push: it would re-sign and
      # replace a release that is already out, so it publishes nothing. Anything else builds unsigned and
      # publishes nothing.
      - name: Decide whether this run may sign and publish
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish=false
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$main...$GITHUB_SHA" --jq .status)"
            if [[ "$status" == identical || "$status" == behind ]]; then
              publish=true
            else
              echo "::warning::Tag $GITHUB_REF_NAME is not on main ($status): building unsigned, nothing is published."
            fi
          else
            echo "::warning::$GITHUB_REF_NAME ($GITHUB_EVENT_NAME, $GITHUB_REF_TYPE) is not main or a tag push: building unsigned, nothing is published."
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Pick the version and whether to rebuild data
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ inputs.rebuild_data }}
        run: |
          previous="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag must look like v1.2.3, got $tag"
              exit 1
            fi
            # The previous release is the newest tag other than this one.
            previous="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vx "$tag" | head -1)"
          else
            # Next patch version; versionCode allows 0-99 per part.
            IFS=. read -r major minor patch <<< "${previous#v}"
            major=${major:-0}; minor=${minor:-1}; patch=${patch:--1}
            patch=$((patch + 1))
            if (( patch > 99 )); then patch=0; minor=$((minor + 1)); fi
            if (( minor > 99 )); then minor=0; major=$((major + 1)); fi
            tag="v$major.$minor.$patch"
          fi

          data=false
          reason="reusing packs from $previous"
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$REBUILD" == true ]]; then
            data=true; reason="monthly refresh or requested"
          elif [[ -z "$previous" ]]; then
            data=true; reason="no earlier release"
          elif ! gh release view "$previous" --json assets --jq '.assets[].name' > assets.txt 2>/dev/null; then
            data=true; reason="$previous has no release"
          else
            for pack in $PACKS $STATE_PACKS $NYS_SEARCH_PACKS; do
              grep -qx "$pack" assets.txt || { data=true; reason="$previous lacks $pack"; }
            done
            # Every routing pack the previous split listed.
            if grep -qx routing-packs.json assets.txt; then
              gh release download "$previous" --pattern routing-packs.json --dir previous-split
              for pack in $(jq -r 'keys[]' previous-split/routing-packs.json); do
                grep -qx "$pack" assets.txt || { data=true; reason="$previous lacks $pack"; }
              done
            fi
            # The pip lock lives under .github/ (ci.yml installs it too) but is a pipeline input: the search
            # container installs from it, so a lock change rebuilds the packs like a change under pipeline/.
            # pipeline/weather builds the forecast pack in weather.yml, never a release pack: a change there alone
            # rebuilt every pack (v0.1.33, about 40 minutes for search-nys.sqlite).
            if git diff --quiet "$previous" HEAD -- pipeline ':(exclude)pipeline/styles' ':(exclude)pipeline/weather' .github/pipeline-requirements.txt; then :; else
              data=true; reason="pipeline or its pip lock changed since $previous"
            fi
          fi

          # The matrix for the data jobs: one entry per pack (routing-packs.json: the whole split routing build;
          # search-nys.sqlite: that pack and NYS_SEARCH_PACKS).
          packs="$(printf '%s\n' $PACKS $STATE_PACKS | jq -R . | jq -sc .)"

          echo "Release $tag; data: $data ($reason)"
          {
            echo "version=${tag#v}"
            echo "tag=$tag"
            echo "previous=$previous"
            echo "data=$data"
            echo "packs=$packs"
          } >> "$GITHUB_OUTPUT"

  # Builds, tests and gates the release APK, unsigned, and rehearses signing it with a throwaway key. This job
  # runs Gradle, plugins and the repository's scripts, so it has a read-only token and references no secret:
  # the APK goes to the sign job as an artifact.
  app:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's own JDK 17, noted before setup-java replaces JAVA_HOME_17_X64: the signing rehearsal uses it,
      # as the sign job does, so both run apksigner on the same JDK.
      - name: Note the runner's JDK
        run: echo "RUNNER_JDK=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      # No Gradle or build cache here: this job builds what gets signed and published, so it starts from
      # what Gradle's dependency verification and the pinned downloads allow, never from a saved cache.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true

      - name: Check the Gradle wrapper against Gradle's published checksums
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          version=$(sed -n 's#^distributionUrl=.*/gradle-\(.*\)-bin\.zip$#\1#p' "$props")
          published=$(curl -fsSL "https://services.gradle.org/distributions/gradle-$version-bin.zip.sha256")
          pinned=$(sed -n 's/^distributionSha256Sum=//p' "$props")
          if [ "$published" != "$pinned" ]; then
            echo "::error::distributionSha256Sum ($pinned) is not Gradle's published checksum ($published)"
            exit 1
          fi
          published=$(curl -fsSL "https://services.gradle.org/distributions/gradle-$version-wrapper.jar.sha256")
          actual=$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
          if [ "$published" != "$actual" ]; then
            echo "::error::gradle-wrapper.jar ($actual) is not Gradle's published $version wrapper ($published)"
            exit 1
          fi
          echo "Gradle $version wrapper and distribution checksums match gradle.org"

      # Both downloads are checked against pinned SHA-256 values.
      - name: Fetch the offline voice (sherpa-onnx and Piper)
        run: scripts/fetch-voice.sh

      # The release APK is built unsigned (app-release-unsigned.apk) on every event; the sign job signs it.
      - name: Test and build the release APK (unsigned)
        run: |
          set -o pipefail
          if [ -n "${SOUTHBOUND_KEYSTORE_FILE:-}" ]; then
            echo "::error::SOUTHBOUND_KEYSTORE_FILE is set: Gradle would sign the release APK. Signing happens in the sign job."
            exit 1
          fi
          # Dependency verification is forced on the command line, so a gradle.properties change can't
          # relax it. gradle/verification-metadata.xml is written by ci.yml (gate/README.md).
          if [ ! -f gradle/verification-metadata.xml ]; then
            echo "::error::gradle/verification-metadata.xml is missing: run CI on a pull request that deletes it to regenerate it (gate/README.md)."
            exit 1
          fi
          ./gradlew --dependency-verification=strict \
            --init-script gate/file-dependencies.init.gradle -Pgate.configuration=releaseRuntimeClasspath \
            testReleaseUnitTest :app:assembleRelease -Psouthbound.version="$VERSION" \
            :app:dependencies --configuration releaseRuntimeClasspath gateFileDependencies | tee "$RUNNER_TEMP/gradle.log"

      - name: Release gate (compare the unsigned release APK with gate/baseline.json)
        id: gate
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ ! -f "$apk" ]; then
            echo "::error::$apk is missing: the release APK must be built unsigned (the sign job signs it)."
            exit 1
          fi
          python3 gate/gate.py check --require-tools --require-pin --apk "$apk" --deps "$RUNNER_TEMP/gradle.log" \
            --generated build/gate/baseline.generated.json
          python3 -m unittest discover -s gate

      # So a session that can't download artifacts can copy the baseline this APK would need.
      - name: Print the baseline this APK would need
        if: failure() && steps.gate.outcome == 'failure' && hashFiles('build/gate/baseline.generated.json') != ''
        run: |
          echo "::group::build/gate/baseline.generated.json"
          cat build/gate/baseline.generated.json
          echo "::endgroup::"
          gate/annotate-file.sh build/gate/baseline.generated.json baseline-generated 0

      # The same zipalign and apksigner commands the sign job runs, with throwaway keys made here (no secret),
      # so every run shows that the pinned build-tools exist, that apksigner finds a JKS and a PKCS12 keystore
      # without being told the type, and that the result carries exactly the release's signature schemes.
      - name: Rehearse release signing with throwaway keys
        run: |
          set -euo pipefail
          # The runner's own JDK, as the sign job uses (setup-java replaced JAVA_HOME_17_X64 by now).
          export JAVA_HOME="$RUNNER_JDK" PATH="$RUNNER_JDK/bin:$PATH"
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          if [ ! -x "$tools/apksigner" ] || [ ! -x "$tools/zipalign" ]; then
            echo "::error::build-tools $BUILD_TOOLS_VERSION is not on this runner (has: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')). Update BUILD_TOOLS_VERSION."
            exit 1
          fi
          validate_schemes() {
            local flags i seen=" "
            read -ra flags <<< "$SIGNING_SCHEMES"
            if [ "${#flags[@]}" -ne 8 ]; then
              echo "::error::SIGNING_SCHEMES must hold the v1, v2, v3 and v4 flags once each, each followed by true or false"
              return 1
            fi
            for ((i = 0; i < 8; i += 2)); do
              case "${flags[i]}" in
                --v1-signing-enabled | --v2-signing-enabled | --v3-signing-enabled | --v4-signing-enabled) ;;
                *) echo "::error::Unknown flag ${flags[i]} in SIGNING_SCHEMES"; return 1 ;;
              esac
              case "$seen" in
                *" ${flags[i]} "*) echo "::error::${flags[i]} appears twice in SIGNING_SCHEMES"; return 1 ;;
              esac
              seen+="${flags[i]} "
              case "${flags[i+1]}" in
                true | false) ;;
                *) echo "::error::${flags[i]} must be followed by true or false in SIGNING_SCHEMES"; return 1 ;;
              esac
            done
          }
          # What apksigner must report for an APK signed with those flags; v3.1 is never signed, so always false.
          check_schemes() {
            local flags i name
            read -ra flags <<< "$SIGNING_SCHEMES"
            for ((i = 0; i < 8; i += 2)); do
              case "${flags[i]}" in
                --v1-signing-enabled) name="v1 scheme (JAR signing)" ;;
                --v2-signing-enabled) name="v2 scheme (APK Signature Scheme v2)" ;;
                --v3-signing-enabled) name="v3 scheme (APK Signature Scheme v3)" ;;
                --v4-signing-enabled) name="v4 scheme (APK Signature Scheme v4)" ;;
              esac
              grep -qF "Verified using $name: ${flags[i+1]}" "$1" || { echo "::error::Expected 'Verified using $name: ${flags[i+1]}'"; return 1; }
            done
            grep -qF "Verified using v3.1 scheme (APK Signature Scheme v3.1): false" "$1" || { echo "::error::Expected 'Verified using v3.1 scheme (APK Signature Scheme v3.1): false'"; return 1; }
          }
          validate_schemes
          work="$RUNNER_TEMP/rehearsal"
          mkdir -p "$work"
          read -ra schemes <<< "$SIGNING_SCHEMES"
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$work/aligned.apk"
          for type in JKS PKCS12; do
            keytool -genkeypair -keystore "$work/throwaway.$type" -storetype "$type" -storepass throwaway \
              -keypass throwaway -alias throwaway -keyalg RSA -keysize 2048 -validity 1 -dname CN=throwaway
            "$tools/apksigner" sign --ks "$work/throwaway.$type" --ks-key-alias throwaway \
              --ks-pass pass:throwaway --key-pass pass:throwaway "${schemes[@]}" --out "$work/signed.apk" "$work/aligned.apk"
            "$tools/zipalign" -c -P 16 4 "$work/signed.apk"
            "$tools/apksigner" verify --print-certs -v "$work/signed.apk" | tee "$work/verify.txt"
            check_schemes "$work/verify.txt"
            echo "Rehearsal with a $type keystore: OK"
            rm -f "$work/signed.apk" "$work/verify.txt"
          done
          rm -rf "$work"

      # Handed to the sign job. One day is enough: it runs right after this job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.PUBLISH == 'true'
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: reports
          path: |
            **/build/reports/
            build/gate/
          if-no-files-found: ignore
          retention-days: 14

  # Signs the APK the app job built, for a commit that is on main. The only job that references the signing
  # secrets, so it checks out nothing and runs no repository code: GitHub's own actions, gh and the Android
  # SDK's zipalign and apksigner. zizmor's auditor persona asks for these secrets to live in a deployment
  # environment; private repositories on GitHub Free can't have environment secrets, so the guard is this
  # job's if: (the plan's decision) and the on-main check before the key is decoded.
  sign:
    if: >-
      needs.plan.outputs.publish == 'true' &&
      (github.ref == 'refs/heads/main' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    needs: [plan, app]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # The runner's own JDK 17, which is also the one the app job's rehearsal uses. Nothing is downloaded.
      - name: Use the runner's JDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      # The branch is resolved to its SHA first, so a tag called "main" can't stand in for it.
      - name: Check the commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$main...$GITHUB_SHA" --jq .status)
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "::error::$GITHUB_SHA is not on main (compare status: $status), so it is not signed."
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-apk
          path: unsigned

      # The keystore's type is not given to apksigner: it uses the JDK default, which reads both JKS and
      # PKCS12 files (as AGP did), and the secret decodes to a .jks.
      - name: Sign the release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SOUTHBOUND_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SOUTHBOUND_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SOUTHBOUND_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SOUTHBOUND_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          validate_schemes() {
            local flags i seen=" "
            read -ra flags <<< "$SIGNING_SCHEMES"
            if [ "${#flags[@]}" -ne 8 ]; then
              echo "::error::SIGNING_SCHEMES must hold the v1, v2, v3 and v4 flags once each, each followed by true or false"
              return 1
            fi
            for ((i = 0; i < 8; i += 2)); do
              case "${flags[i]}" in
                --v1-signing-enabled | --v2-signing-enabled | --v3-signing-enabled | --v4-signing-enabled) ;;
                *) echo "::error::Unknown flag ${flags[i]} in SIGNING_SCHEMES"; return 1 ;;
              esac
              case "$seen" in
                *" ${flags[i]} "*) echo "::error::${flags[i]} appears twice in SIGNING_SCHEMES"; return 1 ;;
              esac
              seen+="${flags[i]} "
              case "${flags[i+1]}" in
                true | false) ;;
                *) echo "::error::${flags[i]} must be followed by true or false in SIGNING_SCHEMES"; return 1 ;;
              esac
            done
          }
          # What apksigner must report for an APK signed with those flags; v3.1 is never signed, so always false.
          check_schemes() {
            local flags i name
            read -ra flags <<< "$SIGNING_SCHEMES"
            for ((i = 0; i < 8; i += 2)); do
              case "${flags[i]}" in
                --v1-signing-enabled) name="v1 scheme (JAR signing)" ;;
                --v2-signing-enabled) name="v2 scheme (APK Signature Scheme v2)" ;;
                --v3-signing-enabled) name="v3 scheme (APK Signature Scheme v3)" ;;
                --v4-signing-enabled) name="v4 scheme (APK Signature Scheme v4)" ;;
              esac
              grep -qF "Verified using $name: ${flags[i+1]}" "$1" || { echo "::error::Expected 'Verified using $name: ${flags[i+1]}'"; return 1; }
            done
            grep -qF "Verified using v3.1 scheme (APK Signature Scheme v3.1): false" "$1" || { echo "::error::Expected 'Verified using v3.1 scheme (APK Signature Scheme v3.1): false'"; return 1; }
          }
          validate_schemes
          unsigned=unsigned/app-release-unsigned.apk
          if [ ! -f "$unsigned" ]; then
            echo "::error::$unsigned is missing from the app job's unsigned-apk artifact."
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::A SOUTHBOUND_KEYSTORE_BASE64, _KEYSTORE_PASSWORD, _KEY_ALIAS or _KEY_PASSWORD secret is not set. Nothing is published without them."
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore" "$RUNNER_TEMP/aligned.apk"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset KEYSTORE_BASE64
          read -ra schemes <<< "$SIGNING_SCHEMES"
          mkdir -p signed
          out="signed/southbound-$VERSION.apk"
          "$tools/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD "${schemes[@]}" \
            --out "$out" "$RUNNER_TEMP/aligned.apk"
          rm -f "$keystore" "$RUNNER_TEMP/aligned.apk"
          "$tools/zipalign" -c -P 16 4 "$out"
          "$tools/apksigner" verify --print-certs -v "$out" | tee "$RUNNER_TEMP/verify.txt"
          check_schemes "$RUNNER_TEMP/verify.txt"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk"

      # Handed to release-check and publish. One day is enough: they run right after this job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-apk
          path: signed/southbound-${{ needs.plan.outputs.version }}.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Read-only checks before anything is published: the commit is on main, and the signed APK carries the
  # certificate pinned in gate/baseline.json. They run the repository's gate/ script, so they live in a job
  # without a writing token; the publish job runs no gate code.
  release-check:
    needs: [plan, app, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      apk_sha256: ${{ steps.cert.outputs.apk_sha256 }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # Only the gate files: the baseline of the commit the APK was built from, and the script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: gate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-apk
          path: apks

      # The branch is resolved to its SHA first, so a tag called "main" can't stand in for it.
      - name: Check the commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$main...$GITHUB_SHA" --jq .status)
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "::error::$GITHUB_SHA is not on main (compare status: $status), so it is not published."
            exit 1
          fi

      # Fails on an unsigned APK or a certificate other than the one pinned in gate/baseline.json, so a
      # build signed with a different key is never offered as an update.
      - name: Check the signing certificate against gate/baseline.json
        id: cert
        run: |
          apk="apks/southbound-$VERSION.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::No signed release APK ($apk)."
            exit 1
          fi
          python3 gate/gate.py cert --require-pin --apk "$apk"
          echo "apk_sha256=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  # Everything uploads to a draft release; publish turns it into the release at the end. Created only once
  # the APK has passed the gate and the certificate check. This job runs no repository code (it has no
  # checkout), so its write token never sits next to any.
  draft:
    needs: [plan, release-check]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # creates the draft release; this job runs no repository code
    steps:
      # A release that is already out is replaced only when it was made from this very commit (a re-run),
      # never by a different build. A release made on the website has targetCommitish "main", a branch
      # name and not this commit, so it is refused; a draft (from an earlier run, or made on the website) is
      # taken over and pointed at this commit.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          TARGET: ${{ github.sha }}
        run: |
          if view=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq '"\(.isDraft) \(.targetCommitish)"' 2> /dev/null); then
            read -r is_draft existing <<< "$view"
            if [[ "$is_draft" == true ]]; then
              echo "Draft $TAG exists; its files will be replaced."
              [[ "$existing" == "$TARGET" ]] || gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET"
            elif [[ "$existing" == "$TARGET" ]]; then
              echo "Release $TAG exists and was made from this commit; its files will be replaced."
            else
              echo "::error::$TAG is already released from $existing, not from this commit ($TARGET). Its files are not replaced."
              exit 1
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$TARGET" \
              --title "Southbound ${TAG#v}" --notes "Building…"
          fi

  # This job runs the pipeline's scripts and third-party tools with a write token, because each pack goes
  # straight to the draft release (they are too large for artifact storage); nothing else can run here, and
  # it starts only for a commit that is on main and whose APK passed release-check.
  data:
    needs: [plan, release-check, draft]
    if: needs.plan.outputs.data == 'true' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write # uploads each pack to the draft release
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJSON(needs.plan.outputs.packs) }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      PACK: ${{ matrix.pack }}
      # routing-nys and search-nys merge two extracts; drop the inputs afterwards to spare the runner's disk.
      FREE_SOURCES: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build ${{ matrix.pack }}
        env:
          # Optional repository variables (Settings > Secrets and variables >
          # Actions > Variables). The search pack takes its addresses from NYS
          # Address Points, the statewide geodatabase listed on
          # https://gis.ny.gov/streets-addresses (one layer, AddressPoints_SAM;
          # about 336 MB, 6.6 M points, October 2026). ADDRESS_POINTS_URL
          # overrides the link; set it to "none" for OSM's addresses only.
          ADDRESS_POINTS_URL: ${{ vars.ADDRESS_POINTS_URL || 'https://gisdata.ny.gov/GISData/State/Address_Points/SAM_Master_Statewide_Database.gdb.zip' }}
          ADDRESS_POINTS_LAYER: ${{ vars.ADDRESS_POINTS_LAYER }}
          # Overture Places in the search pack, in their own tables (see
          # pipeline/search/overture.py). Set the variable OVERTURE to 0 to
          # leave them out, OVERTURE_RELEASE to pin a release or "latest",
          # OVERTURE_MIN_CONFIDENCE (default 0.5) higher for a smaller pack.
          OVERTURE: ${{ vars.OVERTURE || '1' }}
          OVERTURE_RELEASE: ${{ vars.OVERTURE_RELEASE }}
          OVERTURE_MIN_CONFIDENCE: ${{ vars.OVERTURE_MIN_CONFIDENCE }}
        run: |
          # basemap-western.pmtiles -> tiles-western; routing-nys.tar -> routing-nys;
          # voice-norman.zip -> voice-norman; routing-packs.json -> routing-split (every routing-<x>.tar it lists);
          # search-nys.sqlite -> search-nys, which also cuts NYS_SEARCH_PACKS from it
          if [[ "$PACK" == routing-packs.json ]]; then
            make -C pipeline routing-split
            exit
          fi
          name="${PACK%%.*}"
          kind="${name%%-*}"; region="${name#*-}"
          [[ "$kind" == basemap ]] && kind=tiles
          make -C pipeline "$kind-$region"

      # --clobber replaces a file of the draft, or of a release made from this very commit; the draft job
      # refused anything else, and this checks the release again right before writing to it.
      - name: Checksum and upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.sha }}
        run: |
          read -r is_draft existing <<< "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq '"\(.isDraft) \(.targetCommitish)"')"
          if [[ "$is_draft" != true && "$existing" != "$TARGET" ]]; then
            echo "::error::$TAG is released from $existing, not from this commit ($TARGET). Its files are not replaced."
            exit 1
          fi
          cd pipeline/data/out
          files=("$PACK")
          if [[ "$PACK" == routing-packs.json ]]; then
            mapfile -t -O 1 files < <(jq -r 'keys[]' routing-packs.json)
          elif [[ "$PACK" == search-nys.sqlite ]]; then
            read -ra cut <<< "$NYS_SEARCH_PACKS"
            files+=("${cut[@]}")
          fi
          for file in "${files[@]}"; do
            sha256sum "$file" | tee "$file.sha256"
            ls -lh "$file"
            gh release upload "$TAG" "$file" "$file.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          done

  publish:
    needs: [plan, release-check, draft, data]
    # Runs when the data jobs ran and passed, or were skipped because the previous release's packs are
    # reused; never after a cancel.
    if: ${{ !cancelled() && needs.release-check.result == 'success' && needs.draft.result == 'success' && (needs.data.result == 'success' || needs.data.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write # uploads to the draft release and publishes it
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      DATA: ${{ needs.plan.outputs.data }}
    steps:
      # Only scripts/release-manifest.py (standard library only) is used from this checkout, and
      # pipeline/regions.json, which it reads for southbound-v2.json.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          sparse-checkout: |
            scripts/
            pipeline/regions.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-apk
          path: apk

      # --clobber below replaces a file of the draft, or of a release made from this very commit (a
      # re-run); anything else is a different build trying to overwrite a published release.
      - name: Check the release may be written
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.sha }}
        run: |
          read -r is_draft existing <<< "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq '"\(.isDraft) \(.targetCommitish)"')"
          if [[ "$is_draft" != true && "$existing" != "$TARGET" ]]; then
            echo "::error::$TAG is released from $existing, not from this commit ($TARGET). Its files are not replaced."
            exit 1
          fi

      # Publishes exactly the APK release-check checked.
      - name: Upload the APK that release-check checked
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED: ${{ needs.release-check.outputs.apk_sha256 }}
        run: |
          apk="apk/southbound-$VERSION.apk"
          actual=$(sha256sum "$apk" | cut -d' ' -f1)
          if [ -z "$CHECKED" ] || [ "$actual" != "$CHECKED" ]; then
            echo "::error::$apk ($actual) is not the APK release-check checked ($CHECKED)"
            exit 1
          fi
          (cd apk && sha256sum "southbound-$VERSION.apk" > "southbound-$VERSION.apk.sha256")
          gh release upload "$TAG" "$apk" "$apk.sha256" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Carry packs over from the previous release
        if: env.DATA != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          for pack in $PACKS $STATE_PACKS $NYS_SEARCH_PACKS; do
            gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir out \
              --pattern "$pack" --pattern "$pack.sha256"
          done
          for pack in $(jq -r 'keys[]' out/routing-packs.json); do
            gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir out \
              --pattern "$pack" --pattern "$pack.sha256"
          done
          (cd out && sha256sum -c ./*.sha256)
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          rm -rf out

      # The manifest needs every file's size and SHA-256, so fetch what the
      # jobs uploaded (a draft's files are only reachable with the token).
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir out

      - name: Write the release manifest
        run: |
          (cd out && sha256sum -c ./*.sha256)
          for pack in $PACKS $STATE_PACKS $NYS_SEARCH_PACKS $(jq -r 'keys[]' out/routing-packs.json); do
            [[ -f "out/$pack" ]] || { echo "::error::The release is missing $pack"; exit 1; }
          done
          # southbound.json for every app so far: only the packs they know (see PACKS).
          python3 src/scripts/release-manifest.py out "$VERSION" --only $PACKS > southbound.json
          cat southbound.json
          # southbound-v2.json for apps that route from a tile folder: every pack, with the regions each needs it.
          python3 src/scripts/release-manifest.py out "$VERSION" --v2 --regions src/pipeline/regions.json > southbound-v2.json
          cat southbound-v2.json

      - name: Upload the manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" southbound.json southbound-v2.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$DATA" == true ]]; then
            data_note="Map data rebuilt for this release."
          else
            data_note="Map data unchanged since $PREVIOUS."
          fi
          notes="Install southbound-$VERSION.apk once; Southbound then downloads the map data for the regions you pick and later updates by itself (Settings > Updates). The regions: New York City (nyc), Long Island (li), Hudson Valley (hudson), Capital Region and North Country (capital), Central and Western New York (western), northern and southern New Jersey (njn, njs), Connecticut (ct), eastern and western Pennsylvania (pae, paw), Maryland with Delaware and DC (md), and the Midwest, which the app offers from its next version: northern and southern Ohio (ohn, ohs), Indiana (in), Chicago and northern Illinois and the rest of Illinois (iln, ils), southern Michigan and northern Michigan with the Upper Peninsula (mis, miu), Wisconsin (wi), Minnesota (mn), Iowa (ia), Missouri (mo), North Dakota (nd), South Dakota (sd), Nebraska (ne) and Kansas (ks). Each has a map, basemap-<region>.pmtiles, and a search pack, search-<region>.sqlite, which can be shared to the app by hand. Directions come in pieces the app fetches and combines itself: the main roads of the east (routing-main.tar), of the Midwest (routing-main-midwest.tar) and of the seam between them, plus the routing-<regions>.tar packs of local roads that routing-packs.json lists, each with the regions it serves. Also here: transit-nyc.sqlite (NYC transit schedules), voice-norman.zip (an extra built-in voice, downloaded only if picked in Settings > Voice), and for app versions before the per-region packs search-nys.sqlite and routing-nys.tar (New York and northern New Jersey in one file each). $data_note

          Map data © OpenMapTiles © OpenStreetMap contributors, ODbL. Schedules: MTA."
          # Tags made with this token don't start another run, so no loop.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
            --title "Southbound $VERSION" --notes "$notes"

  # A run that failed leaves no half-built draft behind (a release that was already published is left as it
  # is), and no APK artifacts (126 MB each: the Free plan's artifact storage is 500 MB). Because both are
  # gone, only "Re-run all jobs" recovers a failed run. Runs no repository code.
  cleanup:
    needs: [plan, sign, draft, publish]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # deletes the draft
      actions: write # deletes this run's APK artifacts
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      PUBLISHED: ${{ needs.publish.result }}
    steps:
      - name: Delete the draft
        if: env.PUBLISHED != 'success'
        run: |
          if out=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1); then
            if [[ "$out" == true ]]; then
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
              echo "Deleted the draft $TAG"
            fi
          elif [[ "$out" == *"release not found"* ]]; then
            echo "There is no release $TAG, so no draft to delete."
          else
            echo "::warning::Could not look up release $TAG ($out). If a draft was left, delete it by hand."
          fi

      - name: Delete this run's APK artifacts
        if: always()
        continue-on-error: true
        run: |
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "unsigned-apk" or .name == "signed-apk") | .id')
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "Deleted artifact $id"
          done
